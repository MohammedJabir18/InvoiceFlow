name: "SaaS CI"

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  verify-saas:
    name: "SaaS Build, Type-Check, API Tests & Browser Journeys"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Ensure PostgreSQL server binaries are available for disposable test clusters
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          # Detect installed PostgreSQL bin directory
          PG_DIR=$(find /usr/lib/postgresql -mindepth 1 -maxdepth 1 -name '[0-9]*' | sort -V | tail -n 1)
          echo "INVOICEFLOW_PG_BIN=$PG_DIR/bin" >> $GITHUB_ENV
          echo "Detected PostgreSQL binaries at $PG_DIR/bin"

      - name: Install dependencies
        run: npm ci

      - name: Build SaaS packages
        run: |
          npm run build -w @invoiceflow/shared-types
          npm run build -w @invoiceflow/db
          npm run build -w @invoiceflow/api
          npm run build -w @invoiceflow/web

      - name: Type-check SaaS workspaces
        run: npm run typecheck --workspaces

      - name: Run API test suite on isolated PostgreSQL
        run: npm test

      - name: Run Playwright E2E browser journeys
        run: bash scripts/test-e2e.sh
